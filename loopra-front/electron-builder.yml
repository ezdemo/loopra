appId: com.loopra.desktop
productName: Loopra
copyright: Copyright © 2024 Loopra Team

directories:
  output: release
  buildResources: build

# Electron 由 electron-builder 自动下载（走 .npmrc 的 electron_mirror），
# 并命中 CI 缓存 ~/.cache/electron；不要配置 electronDist 指向本地 dist，
# 否则 CI 上 node_modules/electron/dist 缺失时打包会直接失败
files:
  - dist/**/*

asar: true

extraMetadata:
  loopraDesktopUpdate:
    macSigned: false

# 核心运行时（loopra-web.jar 等）由 CI 解压 loopra-dist artifact 生成到 resources/loopra-core，
# 打包进安装包 resources/loopra-core，首次安装时无需再在线下载核心包
# （本地打包使用 loopra-release 仓库的 .release/ci-embed-core.sh 或 embed-core.ps1，指定本源码目录）
extraResources:
  - from: resources/loopra-core
    to: loopra-core
    filter:
      - "**/*"

# node-pty 为原生模块（.node），必须从 asar 中解包，否则运行时无法加载
asarUnpack:
  - "**/node_modules/node-pty/**"

# ── macOS ──────────────────────────────────────
mac:
  artifactName: 'Loopra-macos-${arch}.${ext}'
  publish:
    provider: github
    owner: ezdemo
    repo: loopra-release
  target:
    - zip
  icon: public/icon-512.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false

# ── Windows ────────────────────────────────────
win:
  artifactName: 'Loopra-windows-${arch}.${ext}'
  publish:
    provider: github
    owner: ezdemo
    repo: loopra-release
  target:
    - target: nsis
      arch: [x64]
  icon: public/favicon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Loopra

# ── Linux ──────────────────────────────────────
linux:
  artifactName: 'Loopra-linux-${arch}.${ext}'
  publish:
    provider: github
    owner: ezdemo
    repo: loopra-release
  target:
    - deb
    - AppImage
  icon: public/favicon.png
  category: Development
  maintainer: Loopra Team
