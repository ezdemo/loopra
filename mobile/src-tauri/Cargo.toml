[package]
name = "loopra-mobile"
version = "0.1.1"
description = "Loopra mobile client"
edition = "2021"
rust-version = "1.90"

[lib]
name = "loopra_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
members = ["relay-core"]
resolver = "2"

[dependencies]
tauri = { version = "2", features = [] }
loopra-relay = { path = "relay-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
