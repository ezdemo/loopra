<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenAPI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--surface,#fff);color:var(--text,#202020);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1000px;margin:auto;padding:24px}header,.actions,.source,.result-heading{display:flex;align-items:center;gap:10px}header{justify-content:space-between;margin-bottom:22px}h1,h2,p{margin:0}h1{font-size:18px}h2{font-size:15px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;padding:8px 14px;border:1px solid var(--line,#e7e7e7);border-radius:9px;background:var(--surface,#fff)}button.primary{background:var(--blue,#4169ff);color:white;border-color:transparent}button.danger{color:var(--danger,#c43838)}button:disabled{opacity:.5;cursor:default}input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line,#ddd);border-radius:9px;background:var(--surface,#fff)}input:focus,select:focus,textarea:focus{outline:2px solid var(--blue,#4169ff);outline-offset:2px}label{display:block;font-size:13px}label input,label select,label textarea{margin-top:5px}textarea{resize:vertical;font-family:monospace}section{margin-top:24px}.card{padding:20px;border:1px solid var(--line,#e7e7e7);border-radius:14px}.search{display:flex;gap:10px}.search input{flex:1;min-width:0}.search button{flex-shrink:0}.source{padding:18px 0;border-bottom:1px solid var(--line,#e7e7e7)}.source-info{flex:1;min-width:0}.url{color:var(--secondary,#777);font-size:12px;overflow-wrap:anywhere}.state{font-size:12px;color:var(--secondary,#777);margin-left:8px}.error{color:var(--danger,#c43838);overflow-wrap:anywhere}.empty{padding:40px;text-align:center;color:var(--secondary,#777);border:1px dashed var(--line,#e7e7e7);border-radius:14px;margin-top:16px}.result{padding:14px 0;border-bottom:1px solid var(--line,#e7e7e7)}.result-heading{justify-content:space-between}code{overflow-wrap:anywhere;font-size:12px}.description{color:var(--secondary,#777);margin:6px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}.footer{justify-content:flex-end;margin-top:20px}#status{min-height:22px;margin-top:12px}pre{padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sidebar,#f6f6f6);border-radius:10px;font-size:12px}.back{margin-bottom:20px}[hidden]{display:none!important}@media(max-width:600px){main{padding:16px}.fields{grid-template-columns:1fr}.source{align-items:flex-start;flex-wrap:wrap}.source-info{flex-basis:100%}.actions{flex-wrap:wrap}.source .actions{margin-top:4px}.search{align-items:stretch}}
</style>
</head>
<body>
<main>
  <header><h1 id="title">OpenAPI</h1><div class="actions" id="toolbar"><button class="primary" id="add">新增接口源</button><button id="reload">刷新</button></div></header>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="home">
    <form class="search" id="search-form"><input id="keyword" aria-label="搜索接口" placeholder="搜索接口，多个关键词用空格分隔" required><button class="primary" type="button" id="search">搜索</button></form>
    <section id="results" aria-label="搜索结果" hidden></section>
    <section aria-label="接口源"><h2>接口源</h2><div id="sources"></div></section>
  </div>
  <form id="editor" class="card" hidden>
    <div class="fields">
      <label>名称<input id="name" maxlength="80" placeholder="可选"></label>
      <label>认证方式<select id="auth-type"><option value="none">无认证</option><option value="bearer">Bearer Token</option><option value="apikey">API Key</option><option value="basic">Basic Auth</option></select></label>
      <label class="wide">文档地址<input id="doc-url" type="url" required placeholder="https://example.com/openapi.json"></label>
      <label class="wide">服务地址<input id="base-url" type="url" placeholder="可选，默认使用文档中的服务地址"></label>
      <label data-auth="bearer">Token<input id="token" type="password" autocomplete="off"></label>
      <label data-auth="apikey">参数名<input id="key-name" autocomplete="off"></label>
      <label data-auth="apikey">参数值<input id="key-value" type="password" autocomplete="off"></label>
      <label data-auth="apikey">参数位置<select id="key-in"><option value="header">请求头</option><option value="query">查询参数</option></select></label>
      <label data-auth="basic">用户名<input id="username" autocomplete="off"></label>
      <label data-auth="basic">密码<input id="password" type="password" autocomplete="off"></label>
      <label class="wide">请求头<textarea id="headers" rows="4" placeholder="每行一个 Key: Value" spellcheck="false"></textarea></label>
    </div>
    <div class="actions footer"><button type="button" id="cancel">取消</button><button class="primary" type="button" id="save">保存并加载</button></div>
  </form>
  <section id="detail" hidden><button id="back" class="back">返回</button><h2 id="detail-title"></h2><pre id="detail-content"></pre></section>
</main>
<script>
const $=id=>document.getElementById(id), pending=new Map();let seq=0,sources=[],editing=null,started=false,busy=false;
function ask(action,value={}){const id=String(++seq);return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('请求超时，请重试'));},45000);pending.set(id,{resolve,reject,timer});parent.postMessage({type:'loopra',op:'service:request',id,action,value},'*');});}
function status(message='',error=false){$('status').textContent=message;$('status').className=error?'error':'';}
async function run(task){if(busy)return;busy=true;document.querySelectorAll('button').forEach(el=>el.disabled=true);status();try{await task();}catch(error){status(error.message,true);}finally{busy=false;document.querySelectorAll('button').forEach(el=>el.disabled=false);}}
function node(tag,text,className){const el=document.createElement(tag);el.textContent=text||'';if(className)el.className=className;return el;}
function button(text,action,className){const el=node('button',text,className);el.type='button';el.onclick=()=>run(action);return el;}
function home(){ $('home').hidden=false;$('editor').hidden=true;$('detail').hidden=true;$('toolbar').hidden=false;$('title').textContent='OpenAPI'; }
async function load(){sources=await ask('sources');renderSources();}
function renderSources(){const container=$('sources');container.replaceChildren();if(!sources.length){container.append(node('p','尚未添加接口源','empty'));return;}
for(const source of sources){const row=node('article','','source'),info=node('div','','source-info');const heading=node('div');heading.append(node('strong',source.name||'OpenAPI 文档'),node('span',({loaded:'已加载',error:'加载失败',disabled:'已停用'})[source.status]||source.status,'state'));info.append(heading,node('div',source.docUrl,'url'));if(source.errorMessage)info.append(node('p',source.errorMessage,'error'));const actions=node('div','','actions');actions.append(button('编辑',()=>edit(source)),button('重新加载',async()=>{try{await ask('refresh',source);status('已重新加载');}finally{await load();}}));const remove=button('删除',async()=>{remove.textContent='确认删除';remove.onclick=()=>run(async()=>{await ask('remove',{docUrl:source.docUrl});await load();});},'danger');actions.append(remove);row.append(info,actions);container.append(row);}}
function authFields(){document.querySelectorAll('[data-auth]').forEach(el=>{el.hidden=el.dataset.auth!==$('auth-type').value;for(const input of el.querySelectorAll('input,select'))input.disabled=el.hidden;});}
function edit(source){editing=source||null;status();$('home').hidden=true;$('detail').hidden=true;$('toolbar').hidden=true;$('editor').hidden=false;$('title').textContent=source?'编辑接口源':'新增接口源';$('editor').reset();$('name').value=source?.name||'';$('doc-url').value=source?.docUrl||'';$('doc-url').readOnly=!!source;$('base-url').value=source?.baseUrl||'';$('auth-type').value=(source?.authType||'none').toLowerCase();const auth=source?.authConfig||{};for(const id of ['token','username','password'])$(id).value=auth[id]||'';$('key-name').value=auth.name||'';$('key-value').value=auth.value||'';$('key-in').value=auth.in||'header';$('headers').value=Object.entries(source?.headers||{}).map(([key,value])=>key+': '+value).join('\n');authFields();$('name').focus();}
function payload(){const headers={};for(const line of $('headers').value.split('\n')){if(!line.trim())continue;const at=line.indexOf(':');if(at<1)throw new Error('请求头格式应为 Key: Value');headers[line.slice(0,at).trim()]=line.slice(at+1).trim();}const type=$('auth-type').value;let authConfig={};if(type==='bearer')authConfig={token:$('token').value};if(type==='basic')authConfig={username:$('username').value,password:$('password').value};if(type==='apikey')authConfig={name:$('key-name').value,value:$('key-value').value,in:$('key-in').value};return {name:$('name').value.trim(),docUrl:$('doc-url').value.trim(),baseUrl:$('base-url').value.trim(),authType:type,authConfig,headers};}
$('editor').onsubmit=event=>{event.preventDefault();run(async()=>{try{await ask(editing?'refresh':'save',payload());home();await load();status('已保存');}catch(error){await load();throw error;}});};
$('search-form').onsubmit=event=>{event.preventDefault();run(async()=>{const results=await ask('search',{keyword:$('keyword').value.trim()}),container=$('results');container.hidden=false;container.replaceChildren(node('h2','搜索结果'));if(!results.length){container.append(node('p','没有匹配的接口','empty'));return;}for(const item of results){const article=node('article','','result'),heading=node('div','','result-heading');heading.append(node('strong',item.api_name),button('查看详情',async()=>{const detail=await ask('detail',{docUrl:item.docUrl,method:item.method,path:item.path});$('home').hidden=true;$('toolbar').hidden=true;$('detail').hidden=false;$('detail-title').textContent=item.api_name;$('detail-content').textContent=JSON.stringify(detail,null,2);}));article.append(heading,node('code',item.endpoint));if(item.description||item.summary)article.append(node('p',item.description||item.summary,'description'));container.append(article);}});};
$('add').onclick=()=>edit();$('reload').onclick=()=>run(load);$('cancel').onclick=()=>{home();status();};$('back').onclick=home;$('auth-type').onchange=authFields;
window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='loopra')return;const data=event.data;if(data.op==='ready'){for(const [key,value]of Object.entries(data.theme||{}))if(value)document.documentElement.style.setProperty('--'+key,value);if(!started){started=true;run(load);}}if(data.op!=='service:result')return;const wait=pending.get(String(data.id));if(!wait)return;pending.delete(String(data.id));clearTimeout(wait.timer);if(data.error)wait.reject(new Error(data.error));else wait.resolve(data.value);});
// Native form submission is disabled by the iframe sandbox. Dispatch our local
// handler explicitly; all requests still go through the authenticated host.
for(const [formId,buttonId]of [['editor','save'],['search-form','search']]){
  const form=$(formId),submit=()=>{if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));};
  $(buttonId).onclick=submit;
  form.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.tagName!=='TEXTAREA'&&event.target.tagName!=='BUTTON'){event.preventDefault();submit();}});
}
authFields();
</script>
</body>
</html>
