<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>每日回顾</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>每日回顾</h1>
    <p id="where">插件卡片上的设置页</p>
    <p>这是一份默认关闭的示例。启用后，侧栏、设置菜单、技能、子代理、每天 9:00 的定时任务和只读工具会一起出现。停用后这些入口消失，这一页还能打开。</p>
    <label>关注点
      <input id="focus" maxlength="80" placeholder="例如：这次改动的失败路径">
    </label>
    <button id="save" class="primary" type="button">保存</button>
    <p id="status"></p>
    <p>留空则不改提示词。保存后，下一轮会把这句话接在系统提示词后面。只读工具是 <code>daily_review__checklist</code>。</p>
  </main>
  <script src="_loopra/bridge.js"></script>
  <script src="app.js"></script>
</body>
</html>
